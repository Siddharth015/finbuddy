# Render Blueprint — provisions FinBuddy (API + bot + Mini App) and a managed
# PostgreSQL database in one click. See https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Set BOT_TOKEN and
# GROQ_API_KEY when prompted (they are marked sync:false so they are never
# stored in git). Everything else is wired automatically — including the public
# URL, which the app reads from RENDER_EXTERNAL_URL to register the webhook and
# the "Open Dashboard" button.

databases:
  - name: finbuddy-db
    plan: free
    databaseName: finbuddy
    user: finbuddy

services:
  - type: web
    name: finbuddy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finbuddy-db
          property: connectionString
      # Random shared secret Telegram echoes back on every webhook call.
      - key: WEBHOOK_SECRET
        generateValue: true
      # Secrets — entered in the Render dashboard, never committed.
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: DEFAULT_CURRENCY
        value: INR
